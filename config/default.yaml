mode: copilot
hotkey: "<ctrl>+<alt>+w"
capture: ocr            # ocr | clipboard | both；默认只 OCR，不读剪贴板
theme: dark             # dark | light

llm:
  base_url: ""         # 空则读环境变量 OPENAI_BASE_URL
  api_key: ""          # 空则读 OPENAI_API_KEY；安装后请在客户端设置里填写
  model: gpt-4o-mini

layout:
  # 微信 PC 左侧会话列表大约这么宽（逻辑像素，会乘系统 DPI）。名单被拖得很宽时可加大。
  sidebar_px: 360
  sidebar_max_ratio: 0.42
  chat_bottom: 0.90
  incoming_max_x: 0.48
  outgoing_min_x: 0.52

policy:
  auto_scenes:
    - smalltalk
    - logistics
  max_auto_per_hour: 20
